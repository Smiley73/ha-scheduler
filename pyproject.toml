[project]
name = "ha-scheduler"
# Placeholder: uv requires a version. The integration's real version lives in
# custom_components/ha_scheduler/manifest.json.
version = "0"
# homeassistant 2026.10.x requires >=3.14.2; the upper bound states 3.14 only.
requires-python = ">=3.14.2,<3.15"
dependencies = [
    # Floor determined by the APIs in use: ConfigFlowResult (2024.4) and the
    # options-flow config_entry property without explicit injection (2024.11/12).
    "homeassistant>=2024.12.0",
    "holidays>=0.107",
    "babel>=2.18.0",
]

[dependency-groups]
dev = [
    # pytest's version is set by pytest-homeassistant-custom-component, which
    # pins it exactly (pytest==9.0.3 as of phacc 0.13.362). This floor only
    # documents the minimum the suite was written against — raising it above
    # phacc's pin makes the install unresolvable.
    "pytest>=9.0.0",
    "pytest-homeassistant-custom-component>=0.13.373",
    "pytest-cov>=7.1.0",
    # Lint tooling is bounded to a minor series: ruff 0.x minors add and change
    # rules, so an open-ended floor lets a new release turn CI red with no commit.
    # 0.16 is the series that treats `logging.<level>(..., exc_info=True)` as a
    # handled blind except (see the broad catches in calendar.py), and is the
    # series Home Assistant core itself pins to.
    "ruff>=0.17.2,<0.18",
    "mypy>=2.4.0,<3",
    "types-PyYAML>=6.0.12.20260906",
    "pre-commit>=4.7.0",
    # Fix for pycares/aiodns compatibility issue
    # Note: Versions must match homeassistant requirements
    "pycares>=4.11.0",
    "aiodns>=3.6.1",
]

# Dependabot configuration for automatic dependency updates
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Monitor Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Smiley73"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group all patch and minor updates together
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Only allow security updates for major version bumps
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Prevent pycares upgrades to 5.0.0+ (incompatible with current aiodns)
      - dependency-name: "pycares"
        versions: [">=5.0.0"]
      # aiodns 4.0.0 requires pycares>=5.0.0 — block until pycares upgrade is vetted
      - dependency-name: "aiodns"
        versions: [">=4.0.0"]
      # homeassistant is pinned intentionally — frozen at current version
      - dependency-name: "homeassistant"
        versions: [">=0.0.0"]

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    reviewers:
      - "Smiley73"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

# Dependabot configuration for automatic dependency updates
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Monitor Python dependencies
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Smiley73"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group all patch and minor updates together, except the lint tooling.
    # ruff/mypy bumps can turn CI red on their own (new or changed rules), so
    # they get their own group: a lint break then fails an isolated PR instead
    # of blocking every other dependency update bundled alongside it.
    groups:
      lint-tooling:
        patterns:
          - "ruff"
          - "mypy"
        update-types:
          - "minor"
          - "patch"
      python-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "ruff"
          - "mypy"
        update-types:
          - "minor"
          - "patch"
    # Only allow security updates for major version bumps
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # pycares and aiodns come only from homeassistant's exact aiodns pin, so
      # they must not move apart from homeassistant/phacc. Kept as a guard in
      # case direct entries for them return.
      - dependency-name: "pycares"
        versions: [">=5.0.0"]
      - dependency-name: "aiodns"
        versions: [">=4.0.0"]
      # The floor in pyproject.toml is the oldest Home Assistant release the
      # integration supports (it matches hacs.json). The tested version comes
      # from phacc's exact pin, and raising the floor would silently drop
      # supported releases.
      - dependency-name: "homeassistant"
        versions: [">=0.0.0"]
      # pytest is dictated by pytest-homeassistant-custom-component, which pins
      # it exactly rather than by a floor. Any bump here is unresolvable: `uv
      # lock` fails before a single test runs (see #65). phacc bumps pytest for
      # us, so the floor below it is decorative. Drop this rule if phacc ever
      # loosens the pin to a range we would need to raise ourselves.
      - dependency-name: "pytest"
        versions: [">=0.0.0"]

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    reviewers:
      - "Smiley73"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

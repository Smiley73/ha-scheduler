name: Test

on:
  push:
  pull_request:
  # Weekly run against the latest unpinned dependencies (holidays, babel,
  # homeassistant) so upstream changes surface without waiting for a PR.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install compatible versions first to avoid conflicts
          pip install "pycares>=4.3.0,<5.0.0" "aiodns>=3.1.0,<4.0.0"
          pip install -r requirements_test.txt
          pip install -r requirements.txt
          
      - name: Verify installation
        run: |
          python -c "
          import sys
          try:
              import pycares
              print(f'✓ pycares {pycares.__version__} imported successfully')
              import aiodns  
              print(f'✓ aiodns {aiodns.__version__} imported successfully')
              import aiohttp
              print(f'✓ aiohttp {aiohttp.__version__} imported successfully')
              print('All DNS resolution dependencies working correctly')
          except Exception as e:
              print(f'✗ Import error: {e}')
              sys.exit(1)
          "

      - name: Run tests with pytest
        run: |
          pytest tests/ --cov=custom_components/ha_scheduler --cov-report=xml --cov-report=term --cov-fail-under=80


      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

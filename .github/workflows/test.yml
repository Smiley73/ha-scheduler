name: Test

on:
  push:
  pull_request:
  # Weekly run against the latest unpinned dependencies (holidays, babel,
  # homeassistant) so upstream changes surface without waiting for a PR.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install compatible versions first to avoid conflicts
          pip install "pycares>=4.3.0,<5.0.0" "aiodns>=3.1.0,<4.0.0"
          pip install -r requirements_test.txt
          pip install -r requirements.txt

      - name: Verify installation
        run: |
          python -c "
          import sys
          try:
              import pycares
              print(f'✓ pycares {pycares.__version__} imported successfully')
              import aiodns
              print(f'✓ aiodns {aiodns.__version__} imported successfully')
              import aiohttp
              print(f'✓ aiohttp {aiohttp.__version__} imported successfully')
              print('All DNS resolution dependencies working correctly')
          except Exception as e:
              print(f'✗ Import error: {e}')
              sys.exit(1)
          "

      - name: Run tests with pytest
        run: |
          pytest tests/ --cov=custom_components/ha_scheduler --cov-report=xml --cov-report=term --cov-fail-under=95


      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

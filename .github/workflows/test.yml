name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify installation
        run: |
          uv run --locked python -c "
          import sys
          try:
              import pycares
              print(f'✓ pycares {pycares.__version__} imported successfully')
              import aiodns
              print(f'✓ aiodns {aiodns.__version__} imported successfully')
              import aiohttp
              print(f'✓ aiohttp {aiohttp.__version__} imported successfully')
              print('All DNS resolution dependencies working correctly')
          except Exception as e:
              print(f'✗ Import error: {e}')
              sys.exit(1)
          "

      - name: Run tests with pytest
        run: |
          uv run --locked pytest tests/ --cov=custom_components/ha_scheduler --cov-report=xml --cov-report=term --cov-fail-under=95


      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

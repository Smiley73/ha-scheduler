name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff check
        run: uv run --locked ruff check custom_components/ tests/

      - name: Run ruff format check
        run: uv run --locked ruff format --check custom_components/ tests/

      - name: Run mypy (strict typing)
        run: uv run --locked mypy custom_components/ha_scheduler/

      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.python-version', '.pre-commit-config.yaml') }}

      # ruff, mypy and pytest already run as their own steps here and in the
      # Test workflow, so they are skipped rather than run twice. What is left
      # is the whitespace/YAML/large-file/merge-marker hooks, which nothing
      # else enforces: they otherwise bind only developers who ran
      # `pre-commit install`, not web edits or a fresh clone.
      - name: Run repo hygiene hooks
        env:
          SKIP: ruff-check,ruff-format,mypy,pytest-check
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure

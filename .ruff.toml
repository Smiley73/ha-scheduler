# Pinned: inferring 3.14 from requires-python makes the formatter drop the
# parentheses around multi-exception `except` clauses. 3.12 is the lowest
# target that accepts the `type` statement in schedule_generator.py.
target-version = "py312"

[lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "S",   # flake8-bandit (security)
    "B",   # flake8-bugbear
    "BLE", # flake8-blind-except
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line length is left to `ruff format`
]

[lint.per-file-ignores]
"tests/*" = [
    "S101",   # asserts are expected in tests
    "S110",   # try-except-pass is a legitimate pattern when probing behavior
    "BLE001", # broad catches are fine when tests probe failure behavior
]

[format]
indent-style = "space"
quote-style = "double"

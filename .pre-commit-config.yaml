# Without this, hooks default to every stage and would also fire on pre-push.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # Local system hook: ruff's version comes from requirements_test.txt
      # alone (dependabot does not watch the pre-commit ecosystem).
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check --fix custom_components/ tests/
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format custom_components/ tests/
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Must not set `pass_filenames: false`: without filenames these fixers
      # inspect nothing and pass as a no-op.
      - id: trailing-whitespace
        # quoted: an unquoted YAML flow sequence would split this on the commas
        args: ["--markdown-linebreak-ext=md,markdown,mdx"]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      # Local so mypy resolves against the installed Home Assistant deps.
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest-check
        name: pytest-check
        entry: python -m pytest tests/ -q
        language: system
        pass_filenames: false
        always_run: true

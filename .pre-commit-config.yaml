# Pre-commit hooks for Home Assistant Scheduler integration
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      # Ruff runs as a local system hook (like mypy and pytest below) so its
      # version comes from requirements_test.txt alone. A pinned `rev:` here
      # would be a second, independently drifting source of the ruff version,
      # and dependabot does not watch the pre-commit ecosystem.
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check --fix custom_components/ tests/
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format custom_components/ tests/
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        pass_filenames: false
        always_run: true
        exclude: '.*\.md$'
      - id: end-of-file-fixer
        pass_filenames: false
        always_run: true
        exclude: '.*\.md$'
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      # Enforce strict typing (quality-scale strict-typing rule). Uses a local
      # system hook so mypy resolves against the installed Home Assistant deps
      # rather than an isolated mirrors-mypy env; config lives in mypy.ini.
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # Run pytest on all tests
      - id: pytest-check
        name: pytest-check
        entry: python -m pytest tests/ -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

# Pre-commit hooks for Home Assistant Scheduler integration
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
        pass_filenames: false
        always_run: true
        exclude: '.*\.md$'
      # Run the formatter
      - id: ruff-format
        pass_filenames: false
        always_run: true
        exclude: '.*\.md$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        pass_filenames: false
        always_run: true
        exclude: '.*\.md$'
      - id: end-of-file-fixer
        pass_filenames: false
        always_run: true
        exclude: '.*\.md$'
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      # Run pytest on all tests
      - id: pytest-check
        name: pytest-check
        entry: python -m pytest tests/ -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
